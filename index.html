<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>RADER.SHADOW.NET</title>
    <script src="https://cdn.ably.com/lib/ably.min-1.js"></script>
    <style>
        :root { 
            --neon: #00ff41; 
            --bg: #030303; 
            --panel: rgba(0, 10, 0, 0.95);
            --dim: rgba(0, 255, 65, 0.2); 
            --border: #00ff41;
            --safe-top: env(safe-area-inset-top);
            --safe-bottom: env(safe-area-inset-bottom);
        }

        /* THEMES */
        [data-theme="red"] { --neon: #ff3e3e; --border: #ff3e3e; --dim: rgba(255, 62, 62, 0.2); }
        [data-theme="blue"] { --neon: #00ccff; --border: #00ccff; --dim: rgba(0, 204, 255, 0.2); }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

        @keyframes scanline { 0% { bottom: 100%; } 100% { bottom: -100%; } }
        @keyframes flicker { 
            0% { opacity: 0.97; } 5% { opacity: 0.85; } 10% { opacity: 0.99; } 
            100% { opacity: 1; } 
        }

        body, html { 
            background: var(--bg); color: var(--neon); 
            font-family: 'Courier New', Courier, monospace;
            height: 100%; width: 100%; overflow: hidden; 
            display: flex; flex-direction: column;
            text-transform: uppercase;
        }

        /* CRT Effects */
        .crt::after {
            content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%), 
                        repeating-linear-gradient(0deg, transparent, transparent 1px, rgba(0, 255, 65, 0.03) 1px, rgba(0, 255, 65, 0.03) 2px);
            background-size: 100% 3px, 100% 100%; pointer-events: none; z-index: 10;
        }

        .app-wrapper { display: flex; flex-direction: column; height: 100vh; width: 100vw; visibility: hidden; animation: flicker 0.15s infinite; }

        /* HEADER */
        header { 
            flex: 0 0 auto; padding: calc(1rem + var(--safe-top)) 1.5rem 1rem; 
            display: flex; justify-content: space-between; align-items: center; 
            background: var(--panel); border-bottom: 2px solid var(--border);
            box-shadow: 0 5px 15px rgba(0,0,0,0.8);
        }
        .brand { font-size: 1rem; font-weight: bold; text-shadow: 0 0 8px var(--neon); letter-spacing: 3px; }

        /* CHAT AREA */
        #chat-box { flex: 1; overflow-y: auto; padding: 1.5rem; display: flex; flex-direction: column; gap: 0.6rem; scroll-behavior: smooth; }
        .entry { font-size: 0.85rem; line-height: 1.4; border-left: 1px solid var(--dim); padding-left: 12px; animation: glitch 0.3s ease; }
        .timestamp { color: #666; font-size: 0.7rem; margin-right: 8px; font-weight: normal; }

        /* FLOATING CONSOLE BAR - Responsive "Middle-Bottom" Position */
        .console { 
            flex: 0 0 55px; display: flex; align-items: center; 
            padding: 0 1.2rem; background: var(--panel); 
            margin: 0 20px calc(15vh + var(--safe-bottom)) 20px; /* ELEVATED POSITION */
            border: 1px solid var(--neon); border-radius: 4px;
            box-shadow: 0 0 20px var(--dim);
            z-index: 20;
        }

        .platform-windows .console { margin: 10px 0 0 0; border-radius: 0; width: 100%; border-left: none; border-right: none; }

        #msgInput { 
            flex: 1; background: transparent; border: none; 
            color: var(--neon); outline: none; font-family: inherit; 
            font-size: 16px; margin-left: 10px;
        }
        #msgInput::placeholder { color: var(--dim); }

        /* BUTTONS */
        #theme-toggle { 
            background: transparent; border: 1px solid var(--neon); 
            color: var(--neon); padding: 5px 12px; cursor: pointer; 
            font-size: 0.65rem; font-family: inherit; transition: all 0.2s;
        }
        #theme-toggle:hover { background: var(--neon); color: black; }

        /* LOCK SCREEN */
        #lock-screen { position: fixed; inset: 0; background: #000; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
        .lock-logo { font-size: 3rem; margin-bottom: 20px; filter: drop-shadow(0 0 10px var(--neon)); }
        .warning-text { color: #ff3e3e; font-weight: bold; letter-spacing: 5px; margin-bottom: 5px; }

        @keyframes glitch {
            0% { transform: translate(2px,0); }
            50% { transform: translate(-2px,0); }
            100% { transform: translate(0); }
        }
    </style>
</head>
<body class="crt">

<div id="lock-screen">
    <div class="lock-logo">⚡</div>
    <div class="warning-text" id="status-msg">SYSTEM ENCRYPTED</div>
    <div id="instruction-text" style="font-size: 0.7rem; opacity: 0.5; color: #fff;">ESTABLISHING P2P PROXY...</div>
</div>

<div class="app-wrapper" id="app-ui">
    <header>
        <div class="brand">RaderSHADOW.NET</div>
            <div class="subbrand">DISCORD=https://discord.gg/KN9PtxZjk</div>
        <button id="theme-toggle" onclick="cycleTheme()">CYC_MODE</button>
    </header>
    <div id="chat-box"></div>
    <div class="console">
        <span style="opacity: 0.8;">[>>]></span>
        <input type="text" id="msgInput" placeholder="AWAITING INPUT..." autocomplete="on">
    </div>
</div>

<script>
    // PLATFORM DETECTION
    const ua = navigator.userAgent.toLowerCase();
    const body = document.body;
    if (/iphone|ipad|ipod/.test(ua)) body.classList.add("platform-ios");
    else if (/android/.test(ua)) body.classList.add("platform-android");
    else body.classList.add("platform-windows");

    // THEME CYCLER
    const themes = ['', 'red', 'blue' , 'puple'];
    let currentThemeIdx = 0;
    function cycleTheme() {
        currentThemeIdx = (currentThemeIdx + 1) % themes.length;
        document.documentElement.setAttribute('data-theme', themes[currentThemeIdx]);
    }

    // CONFIG & CONNECT
    const API_KEY = '8aNVog.se0xuQ:cPGNxEHS92b0xGqx6PpT1jRNDCVD0Y5DFX_6A45BtkA';
    const ACTIVE_CHANNELS = ['rader-2244']; 
    const hashKey = window.location.hash.substring(1).toLowerCase();

    const appUI = document.getElementById('app-ui');
    const lockScreen = document.getElementById('lock-screen');

    if (ACTIVE_CHANNELS.includes(hashKey)) {
        setTimeout(() => {
            lockScreen.style.display = 'none';
            appUI.style.visibility = 'visible';
            connectToNetwork(hashKey);
        }, 1500); // Dramatic pause
    } else {
        document.getElementById('status-msg').textContent = "SIGNAL LOST";
        document.getElementById('instruction-text').textContent = "AUTH_TOKEN_MISSING";
    }

    function connectToNetwork(key) {
        const alias = prompt("IDENTIFY AS?:") || "GHOST_" + Math.random().toString(16).slice(2, 6);
        const ably = new Ably.Realtime(API_KEY);
        const channel = ably.channels.get(`rader-v4-${key}`);
        const chatBox = document.getElementById('chat-box');
        const input = document.getElementById('msgInput');

        channel.subscribe('msg', (p) => {
            const entry = document.createElement('div');
            entry.className = 'entry';
            const hexTime = new Date().getTime().toString(16).slice(-6).toUpperCase();
            entry.innerHTML = `<span class="timestamp">[0x${hexTime}]</span> <b style="color:var(--neon)">${p.data.user}</b>: ${p.data.text}`;
            chatBox.appendChild(entry);
            chatBox.scrollTop = chatBox.scrollHeight;
            
            // Subtle sound effect simulation could go here
        });

        input.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && input.value.trim()) {
                channel.publish('msg', { user: alias, text: input.value });
                input.value = '';
            }
        });
    }
</script>
</body>
</html>
