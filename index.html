<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>R.SHADOW.NET</title>
    <script src="https://cdn.ably.com/lib/ably.min-1.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        /* ROOT VARIABLES - NEON THEME (DEFAULT) */
        :root {
            --neon: #00ff41;
            --bg: #030303;
            --panel: rgba(0, 10, 0, 0.94);
            --dim: rgba(0, 255, 65, 0.2);
            --border: #00ff41;
            --glow: 0 0 8px rgba(0,255,65,0.3);
            --text-glow: 0 0 4px #00ff41;
            --safe-top: env(safe-area-inset-top);
            --safe-bottom: env(safe-area-inset-bottom);
        }

        /* THEME VARIANTS */
        [data-theme="red"] {
            --neon: #ff3e3e;
            --border: #ff3e3e;
            --dim: rgba(255, 62, 62, 0.25);
            --glow: 0 0 8px rgba(255,62,62,0.4);
            --text-glow: 0 0 3px #ff3e3e;
        }
        [data-theme="blue"] {
            --neon: #00ccff;
            --border: #00ccff;
            --dim: rgba(0, 204, 255, 0.25);
            --glow: 0 0 8px rgba(0,204,255,0.4);
            --text-glow: 0 0 3px #00ccff;
        }
        [data-theme="purple"] {
            --neon: #b000ff;
            --border: #b000ff;
            --dim: rgba(176, 0, 255, 0.25);
            --glow: 0 0 8px rgba(176,0,255,0.4);
            --text-glow: 0 0 3px #b000ff;
        }

        /* CRT & ANIMATIONS */
        @keyframes flicker {
            0% { opacity: 0.98; text-shadow: var(--text-glow); }
            5% { opacity: 0.85; text-shadow: none; }
            10% { opacity: 0.99; text-shadow: var(--text-glow); }
            100% { opacity: 1; }
        }
        @keyframes scan {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(100%); }
        }
        body {
            background: var(--bg);
            color: var(--neon);
            font-family: 'Courier New', 'Fira Code', monospace;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            position: relative;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .crt::before {
            content: " ";
            display: block;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(0deg, rgba(0, 255, 65, 0.03) 0px, rgba(0, 255, 65, 0.03) 2px, transparent 2px, transparent 4px);
            pointer-events: none;
            z-index: 5;
        }
        .crt::after {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, transparent 30%, rgba(0,0,0,0.6) 90%);
            pointer-events: none;
            z-index: 6;
        }

        /* LOCK SCREEN (ACCESS CONTROL) */
        #lock-screen {
            position: fixed;
            inset: 0;
            background: #010101;
            backdrop-filter: blur(2px);
            z-index: 10000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
            border: 2px solid var(--neon);
            box-shadow: inset 0 0 50px rgba(0,0,0,0.8), 0 0 25px var(--dim);
            animation: flicker 0.2s infinite;
        }
        .lock-icon {
            font-size: 4rem;
            filter: drop-shadow(0 0 12px var(--neon));
            margin-bottom: 1rem;
        }
        .lock-title {
            font-size: 1.5rem;
            letter-spacing: 5px;
            font-weight: bold;
            background: #000;
            padding: 0.5rem 1rem;
            border-left: 3px solid var(--neon);
            border-right: 3px solid var(--neon);
            margin-bottom: 1.5rem;
        }
        .warning-blink {
            color: #ff3e3e;
            text-shadow: 0 0 4px red;
            font-weight: bold;
            font-size: 0.85rem;
        }
        .code-input-group {
            margin: 1.8rem 0;
            width: 90%;
            max-width: 320px;
        }
        .code-input-group input {
            width: 100%;
            background: #0a0a0a;
            border: 1px solid var(--neon);
            padding: 12px 18px;
            color: var(--neon);
            font-family: monospace;
            font-size: 1rem;
            text-align: center;
            letter-spacing: 2px;
            outline: none;
            transition: 0.2s;
        }
        .code-input-group input:focus {
            box-shadow: 0 0 15px var(--dim);
            border-width: 2px;
        }
        .access-btn {
            background: transparent;
            border: 1.5px solid var(--neon);
            color: var(--neon);
            padding: 8px 28px;
            font-family: inherit;
            font-weight: bold;
            font-size: 0.85rem;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 0.5rem;
            letter-spacing: 2px;
        }
        .access-btn:hover {
            background: var(--neon);
            color: #000;
            box-shadow: 0 0 18px var(--neon);
        }
        .deny-msg {
            margin-top: 1.5rem;
            font-size: 0.7rem;
            color: #aa4444;
            border-top: 1px dashed #333;
            padding-top: 1rem;
            max-width: 280px;
        }
        .hash-hint {
            font-size: 0.6rem;
            opacity: 0.6;
            margin-top: 1rem;
        }

        /* MAIN APP UI */
        .app-wrapper {
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100vw;
            visibility: hidden;
            background: var(--bg);
            position: relative;
            z-index: 2;
        }

        /* HEADER */
        .cyber-header {
            flex-shrink: 0;
            padding: calc(0.8rem + var(--safe-top)) 1.2rem 0.7rem;
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            flex-wrap: wrap;
            background: var(--panel);
            border-bottom: 2px solid var(--border);
            box-shadow: 0 3px 20px rgba(0,0,0,0.7);
            backdrop-filter: blur(4px);
        }
        .brand {
            font-size: 1.2rem;
            font-weight: bold;
            text-shadow: 0 0 8px var(--neon);
            letter-spacing: 3px;
        }
        .subbrand {
            font-size: 0.65rem;
            opacity: 0.7;
            font-family: monospace;
            background: rgba(0,0,0,0.5);
            padding: 0 6px;
        }
        #theme-toggle {
            background: transparent;
            border: 1px solid var(--neon);
            color: var(--neon);
            padding: 4px 10px;
            font-size: 0.65rem;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.2s;
        }
        #theme-toggle:hover {
            background: var(--neon);
            color: black;
            box-shadow: 0 0 10px var(--neon);
        }

        /* CHAT CONTAINER */
        .chat-area {
            flex: 1;
            overflow-y: auto;
            padding: 1.2rem;
            display: flex;
            flex-direction: column;
            gap: 0.7rem;
            scroll-behavior: smooth;
        }
        .chat-area::-webkit-scrollbar {
            width: 4px;
        }
        .chat-area::-webkit-scrollbar-track {
            background: #111;
        }
        .chat-area::-webkit-scrollbar-thumb {
            background: var(--neon);
        }
        .message-entry {
            font-size: 0.85rem;
            line-height: 1.45;
            border-left: 2px solid var(--neon);
            padding-left: 12px;
            word-break: break-word;
            animation: glitchEntry 0.2s ease-out;
            font-weight: 400;
        }
        .timestamp {
            color: #6b8c6b;
            font-size: 0.65rem;
            margin-right: 10px;
            font-weight: normal;
            letter-spacing: 0;
        }
        .username {
            font-weight: bold;
            color: var(--neon);
            text-shadow: 0 0 2px var(--dim);
        }
        @keyframes glitchEntry {
            0% { opacity: 0; transform: translateX(-4px);}
            100% { opacity: 1; transform: translateX(0);}
        }

        /* TERMINAL INPUT BAR (FIXED BOTTOM - ERGONOMIC) */
        .input-console {
            flex-shrink: 0;
            background: var(--panel);
            border-top: 1px solid var(--neon);
            backdrop-filter: blur(8px);
            padding: 12px 16px calc(12px + var(--safe-bottom));
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 10;
        }
        .prompt-symbol {
            font-weight: bold;
            font-size: 1.1rem;
            opacity: 0.9;
            white-space: nowrap;
        }
        #msgInput {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--neon);
            font-family: 'Courier New', monospace;
            font-size: 1rem;
            outline: none;
            padding: 10px 0;
            width: 100%;
        }
        #msgInput::placeholder {
            color: var(--dim);
            font-size: 0.85rem;
            letter-spacing: 1px;
        }
        /* Platform specific refinements */
        .platform-ios .input-console, .platform-android .input-console {
            padding-bottom: calc(18px + var(--safe-bottom));
        }

        /* system status line */
        .sys-status {
            font-size: 0.6rem;
            background: #0a0f0a;
            padding: 2px 12px;
            text-align: center;
            color: #5f9e5f;
            border-top: 1px dashed var(--dim);
        }

        /* responsive touch optimizations */
        @media (max-width: 600px) {
            .brand { font-size: 0.9rem; }
            .message-entry { font-size: 0.78rem; }
            .cyber-header { padding: 0.7rem 0.9rem; }
            .input-console { padding: 10px 12px calc(10px + var(--safe-bottom)); }
            .prompt-symbol { font-size: 0.9rem; }
        }
    </style>
</head>
<body class="crt">

<!-- ACCESS LOCK SCREEN (DENIED BY DEFAULT) -->
<div id="lock-screen">
    <div class="lock-icon">⛔</div>
    <div class="lock-title">SECURE GATEWAY</div>
    <div id="lockStatus" class="warning-blink">🔐 ACCESS REQUIRED</div>
    <div class="code-input-group">
        <input type="text" id="channelCodeInput" placeholder="ENTER CHANNEL CODE" autocomplete="off" spellcheck="false">
        <button id="submitCodeBtn" class="access-btn">AUTHENTICATE</button>
    </div>
    <div class="deny-msg" id="denyMessage">NO VALID CHANNEL CODE → ACCESS DENIED</div>
    <div class="hash-hint">[ R.SHADOW SURVEILLANCE ]</div>
</div>

<!-- MAIN CHAT INTERFACE -->
<div class="app-wrapper" id="app-ui">
    <div class="cyber-header">
        <div class="brand">⚡R.SHADOW.NET</div>
        <div class="subbrand">DISCORD: https://discord.gg/KN9PtxZjk | ENCRYPTED CHAIN</div>
        <button id="theme-toggle" aria-label="cycle theme">CYC_MODE</button>
    </div>
    <div id="chat-box" class="chat-area"></div>
    <div class="input-console">
        <span class="prompt-symbol">[&gt;&gt;]&gt;</span>
        <input type="text" id="msgInput" placeholder="ENCRYPTED MESSAGE..." autocomplete="off">
    </div>
    <div class="sys-status" id="connStatus">⚡ SECURE CHANNEL // OFFLINE</div>
</div>

<script>
    // ----------------------------- SECURITY & GLOBALS -------------------------
    // Allowed channel codes (Only these grant access)
    const ALLOWED_CHANNELS = ['rader-2244'];
    const ABLY_API_KEY = '8aNVog.se0xuQ:cPGNxEHS92b0xGqx6PpT1jRNDCVD0Y5DFX_6A45Btk';
    
    let activeAbly = null;
    let activeChannel = null;
    let currentAlias = null;
    let isChatInitialized = false;

    // DOM elements
    const lockScreen = document.getElementById('lock-screen');
    const appUI = document.getElementById('app-ui');
    const chatBox = document.getElementById('chat-box');
    const msgInput = document.getElementById('msgInput');
    const connStatusSpan = document.getElementById('connStatus');
    const lockStatusDiv = document.getElementById('lockStatus');
    const denyMsgSpan = document.getElementById('denyMessage');
    const channelInput = document.getElementById('channelCodeInput');
    const submitBtn = document.getElementById('submitCodeBtn');

    // Helper: sanitize HTML to prevent XSS (cyber security essential)
    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        }).replace(/[\uD800-\uDBFF][\uDC00-\uDFFF]/g, function(c) {
            return c;
        });
    }

    // Format timestamp (HEX style matching original aesthetic)
    function getHexTimestamp() {
        return '0x' + new Date().getTime().toString(16).slice(-6).toUpperCase();
    }

    // Append message to chat (secure, sanitized)
    function appendMessage(user, text, isSystem = false) {
        const entry = document.createElement('div');
        entry.className = 'message-entry';
        const timeHex = getHexTimestamp();
        if (isSystem) {
            entry.innerHTML = `<span class="timestamp">[${timeHex}]</span> <span style="color:#acacac;">🔒 SYSTEM: ${escapeHtml(text)}</span>`;
        } else {
            const safeUser = escapeHtml(user);
            const safeText = escapeHtml(text);
            entry.innerHTML = `<span class="timestamp">[${timeHex}]</span> <span class="username">${safeUser}</span>: ${safeText}`;
        }
        chatBox.appendChild(entry);
        entry.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    // System status update
    function setStatus(text, isError = false) {
        if (connStatusSpan) {
            connStatusSpan.innerHTML = isError ? `⚠️ ${text}` : `🟢 ${text}`;
            connStatusSpan.style.color = isError ? '#ff6666' : 'var(--neon)';
        }
    }

    // Destroy previous connection if any
    function cleanupConnection() {
        if (activeChannel) {
            try { activeChannel.unsubscribe(); } catch(e) {}
        }
        if (activeAbly) {
            try { activeAbly.close(); } catch(e) {}
        }
        activeAbly = null;
        activeChannel = null;
    }

    // Core chat initialization after channel grant
    function initializeSecureChat(channelCode) {
        if (isChatInitialized) {
            cleanupConnection();
            while(chatBox.firstChild) chatBox.removeChild(chatBox.firstChild);
        }
        
        // Ask for alias (professional handle)
        let aliasInput = prompt("IDENTIFY YOUR CREDENTIAL:", "AGENT_" + Math.random().toString(36).substring(2, 6).toUpperCase());
        if (!aliasInput || aliasInput.trim() === "") {
            aliasInput = "GHOST_" + Math.floor(Math.random() * 9000 + 1000);
        }
        currentAlias = aliasInput.trim().substring(0, 20);
        
        setStatus(`CONNECTING TO CHANNEL [${channelCode}]...`);
        
        try {
            activeAbly = new Ably.Realtime(ABLY_API_KEY);
            
            // Channel naming pattern: rader-v4-XXXX
            const channelName = `rader-v4-${channelCode}`;
            activeChannel = activeAbly.channels.get(channelName);
            
            // Subscribe to incoming messages
            activeChannel.subscribe('msg', (message) => {
                if (message.data && typeof message.data === 'object') {
                    const { user, text } = message.data;
                    if (user && text !== undefined) {
                        appendMessage(user, text, false);
                    }
                }
            });
            
            // Connection state monitoring
            activeAbly.connection.on('connected', () => {
                setStatus(`ACTIVE // ENCRYPTED CHANNEL: ${channelCode.toUpperCase()}`);
                appendMessage("🔥 SYSTEM", `Connected to secure relay: ${channelCode}`, true);
            });
            
            activeAbly.connection.on('failed', (err) => {
                setStatus(`CONNECTION FAILURE: RELAY LOST`, true);
                appendMessage("⚠️ CRYPTO", "Link failure – retry or refresh", true);
            });
            
            activeAbly.connection.on('disconnected', () => {
                setStatus("SIGNAL INTERRUPTED - RECONNECTING", true);
            });
            
            isChatInitialized = true;
            
            // Welcome entry
            setTimeout(() => {
                appendMessage("🔷 SYSTEM", `Access granted. Encrypted session active. Alias: ${currentAlias}`, true);
            }, 300);
            
        } catch (err) {
            console.error("Ably init error", err);
            setStatus("FATAL: CRYPTO ENGINE OFFLINE", true);
            appendMessage("⚠️ CRYPTO", "Channel initialization failed. Refresh or check credentials.", true);
        }
    }
    
    // Publish message to channel
    function sendMessage(text) {
        if (!activeChannel || !isChatInitialized) {
            appendMessage("⚠️", "Channel not ready. Wait for sync.", true);
            return false;
        }
        if (!text.trim()) return false;
        const payload = {
            user: currentAlias,
            text: text.trim()
        };
        activeChannel.publish('msg', payload, (err) => {
            if (err) {
                appendMessage("ERROR", "Transmission failed: " + err.message, true);
                setStatus("TX ERROR", true);
            }
        });
        return true;
    }
    
    // ------------------------- ACCESS CONTROL LOGIC -------------------------
    function grantAccess(channelCode) {
        if (!ALLOWED_CHANNELS.includes(channelCode)) {
            // Deny access - update lock UI to reflect invalid
            lockStatusDiv.innerHTML = "⛔ ACCESS DENIED";
            denyMsgSpan.innerHTML = `INVALID CHANNEL CODE: "${escapeHtml(channelCode)}" → TERMINAL BLOCKED`;
            denyMsgSpan.style.color = "#ff5555";
            lockStatusDiv.style.color = "#ff5555";
            return false;
        }
        
        // Valid code: hide lock screen, show chat UI, init
        lockScreen.style.display = 'none';
        appUI.style.visibility = 'visible';
        initializeSecureChat(channelCode);
        
        // Focus input for seamless usage
        setTimeout(() => { if(msgInput) msgInput.focus(); }, 400);
        return true;
    }
    
    // Handle code submission from lock screen input
    function attemptAccessFromInput() {
        let rawCode = channelInput.value.trim().toLowerCase();
        if (rawCode === "") {
            lockStatusDiv.innerHTML = "⚠️ EMPTY CHANNEL CODE";
            denyMsgSpan.innerHTML = "NO CHANNEL CODE PROVIDED → ACCESS DENIED";
            denyMsgSpan.style.color = "#ffaa55";
            return;
        }
        if (grantAccess(rawCode)) {
            // success, UI changes already
        } else {
            // failed: keep lock screen with deny style
            lockStatusDiv.innerHTML = "⛔ INVALID CREDENTIAL";
        }
    }
    
    // Check URL hash fragment first (exact behavior as original)
    function checkHashForAccess() {
        const hash = window.location.hash.substring(1).toLowerCase();
        if (hash && ALLOWED_CHANNELS.includes(hash)) {
            // auto-grant via hash
            grantAccess(hash);
            return true;
        }
        return false;
    }
    
    // ------------------------- UI & PLATFORM ADAPTATIONS -------------------------
    function detectPlatform() {
        const ua = navigator.userAgent.toLowerCase();
        const bodyClass = document.body;
        if (/iphone|ipad|ipod/.test(ua)) bodyClass.classList.add("platform-ios");
        else if (/android/.test(ua)) bodyClass.classList.add("platform-android");
        else bodyClass.classList.add("platform-windows");
        
        // adjust font rendering for mobile
        if (/mobile|android|iphone|ipad/.test(ua)) {
            const style = document.createElement('style');
            style.textContent = `#msgInput { font-size: 16px; } .message-entry { font-size: 0.85rem; }`;
            document.head.appendChild(style);
        }
    }
    
    // Theme cycling (professional)
    const themes = ['', 'red', 'blue', 'purple'];
    let themeIndex = 0;
    function cycleTheme() {
        themeIndex = (themeIndex + 1) % themes.length;
        document.documentElement.setAttribute('data-theme', themes[themeIndex]);
        localStorage.setItem('radersh_theme', themes[themeIndex]);
    }
    function loadSavedTheme() {
        const saved = localStorage.getItem('radersh_theme');
        if (saved && themes.includes(saved)) {
            themeIndex = themes.indexOf(saved);
            document.documentElement.setAttribute('data-theme', saved);
        }
    }
    
    // Chat input handler
    function setupChatEvents() {
        if (!msgInput) return;
        msgInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                const rawMsg = msgInput.value;
                if (rawMsg.trim().length > 0) {
                    sendMessage(rawMsg);
                    msgInput.value = '';
                }
            }
        });
        // Optional click on status area for focus
        document.querySelector('.input-console')?.addEventListener('click', () => msgInput.focus());
    }
    
    // ------------------------- INITIALIZATION FLOW -------------------------
    function bootstrap() {
        detectPlatform();
        loadSavedTheme();
        setupChatEvents();
        
        // Theme toggle button
        const themeBtn = document.getElementById('theme-toggle');
        if (themeBtn) {
            themeBtn.addEventListener('click', cycleTheme);
        }
        
        // Lock screen controls
        submitBtn.addEventListener('click', attemptAccessFromInput);
        channelInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') attemptAccessFromInput();
        });
        
        // Priority: check URL hash (original exact behavior)
        const hashGranted = checkHashForAccess();
        if (!hashGranted) {
            // lock screen remains with deny message + interactive input
            lockStatusDiv.innerHTML = "🔐 AUTHORIZATION REQUIRED";
            denyMsgSpan.innerHTML = "NO VALID CHANNEL CODE → ACCESS DENIED";
            denyMsgSpan.style.color = "#ff6e6e";
            // Additional: display example for user
            channelInput.placeholder = "";
            // keep lock screen visible, no chat UI
            appUI.style.visibility = 'hidden';
        } else {
            // UI already visible due to grantAccess
            // ensure lock screen hidden, focus chat
            setTimeout(() => {
                if(msgInput) msgInput.focus();
            }, 500);
        }
    }
    
    // Ensure proper cleanup on page unload
    window.addEventListener('beforeunload', () => {
        if (activeAbly) activeAbly.close();
    });
    
    // start everything
    bootstrap();
</script>
</body>
</html>
