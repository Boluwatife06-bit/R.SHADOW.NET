<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes, viewport-fit=cover">
    <title>Rader Shadow</title>
    <script src="https://cdn.ably.com/lib/ably.min-1.js"></script>
    <style>
        /* Reset & base styles – modern messaging look */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            height: 100%;
            width: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            transition: background-color 0.2s, color 0.2s;
        }

        /* Light / dark theme variables (default light) */
        :root {
            --bg-primary: #f5f5f5;
            --bg-secondary: #ffffff;
            --bg-input: #ffffff;
            --text-primary: #111111;
            --text-secondary: #5e5e5e;
            --bubble-other: #e9e9eb;
            --bubble-own: #007aff;
            --bubble-own-text: white;
            --border-light: #cccccc;
            --header-bg: #ffffff;
            --shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        [data-theme="dark"] {
            --bg-primary: #1c1c1e;
            --bg-secondary: #2c2c2e;
            --bg-input: #3a3a3c;
            --text-primary: #ffffff;
            --text-secondary: #a9a9b0;
            --bubble-other: #3a3a3c;
            --bubble-own: #0a7aff;
            --bubble-own-text: white;
            --border-light: #38383a;
            --header-bg: #1c1c1e;
            --shadow: 0 2px 8px rgba(0,0,0,0.2);
        }

        /* Main layout */
        .app {
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100vw;
            background-color: var(--bg-primary);
        }

        /* Header – clean, like a chat header */
        .chat-header {
            background-color: var(--header-bg);
            padding: 0.8rem 1rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-light);
            box-shadow: var(--shadow);
            flex-shrink: 0;
        }

        .chat-title {
            font-weight: 600;
            font-size: 1.1rem;
            color: var(--text-primary);
        }

        .chat-subtitle {
            font-size: 0.7rem;
            color: var(--text-secondary);
            margin-top: 2px;
        }

        .theme-toggle {
            background: transparent;
            border: 1px solid var(--border-light);
            border-radius: 20px;
            padding: 0.4rem 0.8rem;
            font-size: 0.8rem;
            color: var(--text-primary);
            cursor: pointer;
            transition: all 0.2s;
        }

        .theme-toggle:hover {
            background: var(--bubble-other);
        }

        /* Chat area – message list */
        .message-list {
            flex: 1;
            overflow-y: auto;
            padding: 1rem 1rem 0.5rem 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            scroll-behavior: smooth;
        }

        /* Individual message row */
        .message-row {
            display: flex;
            width: 100%;
        }

        .message-row.own {
            justify-content: flex-end;
        }

        .message-row.other {
            justify-content: flex-start;
        }

        /* Message bubble */
        .bubble {
            max-width: 80%;
            padding: 0.6rem 1rem;
            border-radius: 20px;
            font-size: 0.95rem;
            line-height: 1.4;
            word-wrap: break-word;
            position: relative;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }

        .own .bubble {
            background-color: var(--bubble-own);
            color: var(--bubble-own-text);
            border-bottom-right-radius: 4px;
        }

        .other .bubble {
            background-color: var(--bubble-other);
            color: var(--text-primary);
            border-bottom-left-radius: 4px;
        }

        /* Timestamp inside bubble */
        .timestamp {
            font-size: 0.65rem;
            opacity: 0.7;
            margin-left: 0.5rem;
            white-space: nowrap;
            display: inline-block;
            vertical-align: baseline;
        }

        .own .timestamp {
            color: rgba(255,255,255,0.8);
        }

        .other .timestamp {
            color: var(--text-secondary);
        }

        /* Input area – fixed at bottom */
        .input-area {
            background-color: var(--bg-secondary);
            border-top: 1px solid var(--border-light);
            padding: 0.75rem 1rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            flex-shrink: 0;
            box-shadow: 0 -2px 5px rgba(0,0,0,0.02);
        }

        #msgInput {
            flex: 1;
            background-color: var(--bg-input);
            border: 1px solid var(--border-light);
            border-radius: 30px;
            padding: 0.7rem 1.2rem;
            font-size: 1rem;
            color: var(--text-primary);
            outline: none;
            transition: border 0.2s;
        }

        #msgInput:focus {
            border-color: var(--bubble-own);
        }

        #sendBtn {
            background-color: var(--bubble-own);
            border: none;
            border-radius: 30px;
            padding: 0.7rem 1.5rem;
            font-size: 1rem;
            font-weight: 500;
            color: white;
            cursor: pointer;
            transition: opacity 0.2s;
            white-space: nowrap;
        }

        #sendBtn:active {
            opacity: 0.7;
        }

        /* Lock screen / loading */
        #lock-screen {
            position: fixed;
            inset: 0;
            background-color: var(--bg-primary);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
            gap: 1rem;
            transition: background 0.2s;
        }

        .lock-logo {
            font-size: 3rem;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.1));
        }

        .warning-text {
            font-size: 1.5rem;
            font-weight: 600;
            color: #ff3b30;
        }

        #instruction-text {
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        /* small screens */
        @media (max-width: 480px) {
            .bubble {
                max-width: 90%;
                font-size: 0.9rem;
            }
            .chat-title {
                font-size: 1rem;
            }
            #sendBtn {
                padding: 0.7rem 1.2rem;
            }
        }
    </style>
</head>
<body>
    <!-- Lock screen (shown until valid hash) -->
    <div id="lock-screen">
        <div class="lock-logo">💬</div>
        <div class="warning-text" id="status-msg">CONNECTING</div>
        <div id="instruction-text">Use #rader-2244 in URL</div>
    </div>

    <!-- Main app UI (hidden until auth) -->
    <div class="app" id="app-ui" style="display: none;">
        <!-- Simple header -->
        <div class="chat-header">
            <div>
                <div class="chat-title">Rader Shadow</div>
                <div class="chat-subtitle">discord.gg/KN9PtxZjk</div>
            </div>
            <button class="theme-toggle" id="themeToggle">🌙 Dark</button>
        </div>

        <!-- Message list container -->
        <div id="chat-box" class="message-list"></div>

        <!-- Input area with send button -->
        <div class="input-area">
            <input type="text" id="msgInput" placeholder="Message" autocomplete="off">
            <button id="sendBtn">Send</button>
        </div>
    </div>

    <script>
        (function() {
            // ----- Theme handling (light/dark) -----
            const themes = ['light', 'dark'];
            let currentThemeIdx = 0; // 0 = light (default)

            function cycleTheme() {
                currentThemeIdx = (currentThemeIdx + 1) % themes.length;
                const newTheme = themes[currentThemeIdx];
                document.documentElement.setAttribute('data-theme', newTheme);
                // Update button text
                const toggleBtn = document.getElementById('themeToggle');
                if (toggleBtn) {
                    toggleBtn.textContent = newTheme === 'dark' ? '☀️ Light' : '🌙 Dark';
                }
            }

            // Set default theme (light) and ensure attribute is set
            document.documentElement.setAttribute('data-theme', 'light');

            // ----- Platform detection (for any special tweaks, not essential) -----
            const ua = navigator.userAgent.toLowerCase();
            const isMobile = /iphone|ipad|ipod|android/.test(ua);

            // ----- Ably configuration -----
            const API_KEY = '8aNVog.se0xuQ:cPGNxEHS92b0xGqx6PpT1jRNDCVD0Y5DFX_6A45BtkA';
            const ACTIVE_CHANNELS = ['rader-2244'];
            const hashKey = window.location.hash.substring(1).toLowerCase();

            const appUI = document.getElementById('app-ui');
            const lockScreen = document.getElementById('lock-screen');
            const statusMsg = document.getElementById('status-msg');
            const instructionText = document.getElementById('instruction-text');

            // Check for valid channel hash
            if (ACTIVE_CHANNELS.includes(hashKey)) {
                // Show app after a short delay (smooth transition)
                setTimeout(() => {
                    lockScreen.style.display = 'none';
                    appUI.style.display = 'flex';  // app uses flex layout
                    connectToNetwork(hashKey);
                }, 800);
            } else {
                statusMsg.textContent = "⚠️ Invalid link";
                instructionText.textContent = "Please use #rader-2244 in the URL";
            }

            // Global variable to store current user alias
            let currentUserAlias = '';

            function connectToNetwork(channelKey) {
                // Ask for alias (modern prompt)
                let alias = prompt("Enter your display name:", "Guest_" + Math.random().toString(36).slice(2, 6));
                if (!alias || alias.trim() === '') {
                    alias = "Anonymous_" + Math.floor(Math.random() * 1000);
                }
                currentUserAlias = alias.trim();

                // Initialize Ably
                const ably = new Ably.Realtime(API_KEY);
                const channel = ably.channels.get(`rader-v4-${channelKey}`);
                const chatBox = document.getElementById('chat-box');
                const msgInput = document.getElementById('msgInput');
                const sendBtn = document.getElementById('sendBtn');

                // Function to append a message to the chat
                function appendMessage(user, text, isOwn) {
                    const row = document.createElement('div');
                    row.className = `message-row ${isOwn ? 'own' : 'other'}`;

                    const bubble = document.createElement('div');
                    bubble.className = 'bubble';

                    // Message text
                    const textSpan = document.createElement('span');
                    textSpan.textContent = text;
                    bubble.appendChild(textSpan);

                    // Timestamp (HH:MM)
                    const time = new Date();
                    const timeStr = time.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                    const timeSpan = document.createElement('span');
                    timeSpan.className = 'timestamp';
                    timeSpan.textContent = timeStr;
                    bubble.appendChild(timeSpan);

                    row.appendChild(bubble);
                    chatBox.appendChild(row);

                    // Scroll to bottom
                    chatBox.scrollTop = chatBox.scrollHeight;
                }

                // Subscribe to incoming messages
                channel.subscribe('msg', (msg) => {
                    const data = msg.data;
                    const isOwn = (data.user === currentUserAlias);
                    appendMessage(data.user, data.text, isOwn);
                });

                // Function to send a message
                function sendMessage() {
                    const text = msgInput.value.trim();
                    if (text === '') return;
                    // Publish to channel
                    channel.publish('msg', { user: currentUserAlias, text: text });
                    msgInput.value = ''; // clear input
                }

                // Event listeners
                msgInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        sendMessage();
                    }
                });

                sendBtn.addEventListener('click', (e) => {
                    e.preventDefault();
                    sendMessage();
                });

                // Optional: add a system message when joining
                // (could be a join alert, but not necessary)
            }

            // Theme toggle button listener (attached after app UI is visible)
            document.getElementById('themeToggle')?.addEventListener('click', cycleTheme);

            // Also ensure the theme toggle works if the button is dynamically added later? 
            // But it's already in the static HTML inside #app-ui, so it's fine.
            // However, the button exists only after app UI is visible. The listener can be attached now, as the element exists in DOM (hidden).
            // So we attach listener after DOM ready.
        })();
    </script>
</body>
</html>
